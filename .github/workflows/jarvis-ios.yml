name: JARVIS iOS build

on:
  pull_request:
    paths:
      - "ios/JARVIS/**"
      - "ios/JARVIS.xcodeproj/**"
      - "ios/JARVISTests/**"
      - "tests/test_jarvis_ios_contract.py"
      - ".github/workflows/jarvis-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-compile:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Xcode environment
        run: xcodebuild -version
      - name: Native project contract
        run: |
          plutil -lint ios/JARVIS.xcodeproj/project.pbxproj
          python3 -m unittest discover -s tests -p 'test_jarvis_ios_contract.py' -q
      - name: Grounded response test without microphone
        run: |
          swiftc -o /tmp/jarvis-ios-replies ios/JARVISTests/main.swift ios/JARVIS/Sources/JARVISResponse.swift
          /tmp/jarvis-ios-replies
      - name: iOS Simulator build without codesign
        run: |
          xcodebuild -project ios/JARVIS.xcodeproj -scheme JARVIS \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/jarvis-ios-derived \
            CODE_SIGNING_ALLOWED=NO build
