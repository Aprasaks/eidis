name: JARVIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-web:
    name: Python tests and web syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q app.py jarvis tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: node --check web/app.js
      - name: Check macOS launcher syntax
        run: bash -n START_JARVIS.command
