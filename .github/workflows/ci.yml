name: JARVIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-web:
    name: Python tests and web syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q app.py jarvis tests
      - run: python -m unittest discover -s tests -v
      - run: node --check web/terminal.js
      - run: node --check web/app.js
      - run: bash -n START_JARVIS.command START_JARVIS_MAC.command macos/scripts/package-app.sh

  macos-compile:
    name: macOS SwiftUI compile
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Install Chrome bridge dependencies (bundled into the app)
        run: npm ci --ignore-scripts
        working-directory: tools/chrome-bridge
      - name: Build development JARVIS.app (no TCC prompts in CI)
        run: bash macos/scripts/package-app.sh
      - name: Test on-device Korean speech vocabulary hints
        run: |
          swiftc -parse-as-library -o /tmp/dechive-speech-vocabulary-smoke macos/tests/voice/speech-vocabulary.swift macos/Sources/EidisMac/JarvisSpeechVocabulary.swift
          /tmp/dechive-speech-vocabulary-smoke
      - name: Test local screenshot-text question logic
        run: |
          swiftc -o /tmp/jarvis-screen-insights-test macos/tests/main.swift macos/Sources/EidisMac/LocalScreenInsights.swift macos/Sources/EidisMac/JarvisSafePressPolicy.swift macos/Sources/EidisMac/ApprovedProjectsPanel.swift macos/Sources/EidisMac/LocalGitInspector.swift macos/Sources/EidisMac/JarvisHandoffReport.swift macos/Sources/EidisMac/JarvisWorkspaceResume.swift macos/Sources/EidisMac/WorkspaceResumePanel.swift macos/Sources/EidisMac/JarvisWorkspaceCommand.swift macos/Sources/EidisMac/JarvisTaskNote.swift macos/Sources/EidisMac/JarvisNoteLibrary.swift macos/Sources/EidisMac/JarvisNoteRevision.swift macos/Sources/EidisMac/JarvisLocalPlanning.swift
          /tmp/jarvis-screen-insights-test
      - name: Check native local-command roundtrip verification guards (fixture only)
        run: |
          swiftc -o /tmp/jarvis-roundtrip-test macos/tests/roundtrip/main.swift macos/Sources/EidisMac/JarvisRoundTrip.swift
          /tmp/jarvis-roundtrip-test
      - name: Test evidence-grounded local AI planning policy (no model calls)
        run: |
          SOURCE=macos/Sources/EidisMac
          swiftc -o /tmp/jarvis-local-planner-test macos/tests/planner/main.swift macos/Sources/EidisMac/ApprovedProjectsPanel.swift macos/Sources/EidisMac/JarvisHandoffReport.swift macos/Sources/EidisMac/JarvisLocalPlanning.swift macos/Sources/EidisMac/LocalGitInspector.swift macos/Sources/EidisMac/JarvisWorkspaceResume.swift macos/Sources/EidisMac/WorkspaceResumePanel.swift macos/Sources/EidisMac/JarvisWorkspaceCommand.swift "$SOURCE"/JarvisTaskNote.swift "$SOURCE"/JarvisNoteLibrary.swift "$SOURCE"/JarvisNoteRevision.swift
          /tmp/jarvis-local-planner-test
      - name: Verify packed localhost server and native bootstrap without app launch
        run: |
          test -f dist/JARVIS.app/Contents/Resources/app.py
          test -f dist/JARVIS.app/Contents/Resources/jarvis/server.py
          test -f dist/JARVIS.app/Contents/Resources/web/index.html
          test ! -f dist/JARVIS.app/Contents/Resources/.env
          test ! -f dist/JARVIS.app/Contents/Resources/memory.sqlite3
          swiftc -D JARVIS_SERVER_SMOKE -o /tmp/jarvis-bundled-server-guards macos/tests/server/main.swift macos/Sources/EidisMac/JarvisBundledServer.swift
          /tmp/jarvis-bundled-server-guards "$PWD/dist/JARVIS.app/Contents/Resources"
      - name: Verify cinematic native dashboard and state-driven launch
        run: |
          swiftc -o /tmp/jarvis-v37-dashboard-smoke macos/tests/dashboard/main.swift macos/Sources/EidisMac/JarvisSystemSnapshot.swift macos/Sources/EidisMac/JarvisCoreView.swift macos/Sources/EidisMac/JarvisStatusBadge.swift macos/Sources/EidisMac/JarvisIntroSplashView.swift macos/Sources/EidisMac/JarvisDashboardHomeView.swift macos/Sources/EidisMac/JarvisImmersiveHomeView.swift macos/Sources/EidisMac/JarvisHologramView.swift
          /tmp/jarvis-v37-dashboard-smoke

      - name: Test Korean speech finalization decision (no microphone access)
        run: |
          swiftc -o /tmp/jarvis-voice-decision macos/tests/voice/main.swift macos/Sources/EidisMac/LocalSpeechDecision.swift
          /tmp/jarvis-voice-decision
      - name: Test DECHIVE selective thinking and explicit thought memory (no mic)
        run: |
          swiftc -parse-as-library -o /tmp/dechive-thinking-smoke macos/tests/thinking/main.swift macos/Sources/EidisMac/JarvisThinkingCore.swift macos/Sources/EidisMac/JarvisLocalModelConfiguration.swift
          /tmp/dechive-thinking-smoke
      - name: Test Action Core explicit delegation and query parsing
        run: |
          swiftc -parse-as-library -o /tmp/dechive-action-smoke macos/tests/action/main.swift macos/Sources/EidisMac/JarvisActionCore.swift
          /tmp/dechive-action-smoke
      - name: Test Research Core explicit delegation and source field
        run: |
          swiftc -parse-as-library -o /tmp/dechive-research-smoke macos/tests/research/main.swift macos/Sources/EidisMac/JarvisResearchCore.swift
          /tmp/dechive-research-smoke
      - name: Test Research 1.1 verification intents and shared model gate
        run: |
          swiftc -parse-as-library -o /tmp/dechive-verification-smoke macos/tests/research/verification-smoke.swift macos/Sources/EidisMac/JarvisResearchVerification.swift macos/Sources/EidisMac/JarvisThinkingCore.swift macos/Sources/EidisMac/JarvisLocalModelConfiguration.swift
          /tmp/dechive-verification-smoke
      - name: Test Browser Control 1.0 intent and safe navigation policy
        run: |
          swiftc -parse-as-library -o /tmp/dechive-browser-policy-smoke macos/tests/browser/main.swift macos/Sources/EidisMac/JarvisBrowserControlPolicy.swift
          /tmp/dechive-browser-policy-smoke
      - name: Test conversation first voice focus policy
        run: |
          swiftc -parse-as-library -o /tmp/dechive-voice-focus-smoke macos/tests/voice-focus/main.swift macos/Sources/EidisMac/JarvisVoiceShortcutPolicy.swift
          /tmp/dechive-voice-focus-smoke
      - name: Test English commands open the existing boards
        run: |
          swiftc -parse-as-library -o /tmp/dechive-english-command-smoke macos/tests/english-command/main.swift macos/Sources/EidisMac/JarvisEnglishCommand.swift macos/Sources/EidisMac/JarvisLocalModelConfiguration.swift
          /tmp/dechive-english-command-smoke
      - name: Test live local Mac clock and safe fast-chat routing
        run: |
          swiftc -parse-as-library -o /tmp/dechive-clock-speed-smoke macos/tests/clock-speed/main.swift macos/Sources/EidisMac/JarvisLocalClockAndRouting.swift
          /tmp/dechive-clock-speed-smoke
      - name: Test fixed-command local Git reader
        run: |
          swiftc -o /tmp/jarvis-local-git-test macos/tests/git/main.swift macos/Sources/EidisMac/LocalGitInspector.swift
          /tmp/jarvis-local-git-test "$PWD"
      - name: Smoke test native Work UI offscreen (no TCC prompts)
        run: |
          swiftc -o /tmp/jarvis-ui-smoke macos/tests/ui/main.swift macos/Sources/EidisMac/ApprovedProjectsPanel.swift macos/Sources/EidisMac/JarvisWorkspaceResume.swift macos/Sources/EidisMac/WorkspaceResumePanel.swift macos/Sources/EidisMac/JarvisHandoffReport.swift macos/Sources/EidisMac/LocalGitInspector.swift macos/Sources/EidisMac/JarvisWorkspaceCommand.swift macos/Sources/EidisMac/JarvisTaskNote.swift macos/Sources/EidisMac/JarvisNoteLibrary.swift macos/Sources/EidisMac/JarvisNoteRevision.swift macos/Sources/EidisMac/JarvisLocalPlanning.swift
          /tmp/jarvis-ui-smoke
      - name: Verify bundle structure, usage descriptions and signature
        run: |
          test -x dist/JARVIS.app/Contents/MacOS/EidisMac
          plutil -lint dist/JARVIS.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' dist/JARVIS.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSSpeechRecognitionUsageDescription' dist/JARVIS.app/Contents/Info.plist
          codesign --verify dist/JARVIS.app
