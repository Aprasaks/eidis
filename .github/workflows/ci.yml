name: JARVIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-web:
    name: Python tests and web syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q app.py jarvis tests
      - run: python -m unittest discover -s tests -v
      - run: node --check web/terminal.js
      - run: node --check web/app.js
      - run: bash -n START_JARVIS.command START_JARVIS_MAC.command macos/scripts/package-app.sh

  macos-compile:
    name: macOS SwiftUI compile
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build development JARVIS.app (no TCC prompts in CI)
        run: bash macos/scripts/package-app.sh
      - name: Test local screenshot-text question logic
        run: |
          swiftc -o /tmp/jarvis-screen-insights-test macos/tests/main.swift macos/Sources/EidisMac/LocalScreenInsights.swift macos/Sources/EidisMac/JarvisSafePressPolicy.swift macos/Sources/EidisMac/ApprovedProjectsPanel.swift macos/Sources/EidisMac/LocalGitInspector.swift macos/Sources/EidisMac/JarvisHandoffReport.swift macos/Sources/EidisMac/JarvisWorkspaceResume.swift macos/Sources/EidisMac/WorkspaceResumePanel.swift macos/Sources/EidisMac/JarvisWorkspaceCommand.swift macos/Sources/EidisMac/JarvisTaskNote.swift macos/Sources/EidisMac/JarvisNoteLibrary.swift macos/Sources/EidisMac/JarvisNoteRevision.swift macos/Sources/EidisMac/JarvisLocalPlanning.swift
          /tmp/jarvis-screen-insights-test
      - name: Check native local-command roundtrip verification guards (fixture only)
        run: |
          swiftc -o /tmp/jarvis-roundtrip-test macos/tests/roundtrip/main.swift macos/Sources/EidisMac/JarvisRoundTrip.swift
          /tmp/jarvis-roundtrip-test
      - name: Test evidence-grounded local AI planning policy (no model calls)
        run: |
          SOURCE=macos/Sources/EidisMac
          swiftc -o /tmp/jarvis-local-planner-test macos/tests/planner/main.swift macos/Sources/EidisMac/ApprovedProjectsPanel.swift macos/Sources/EidisMac/JarvisHandoffReport.swift macos/Sources/EidisMac/JarvisLocalPlanning.swift macos/Sources/EidisMac/LocalGitInspector.swift macos/Sources/EidisMac/JarvisWorkspaceResume.swift macos/Sources/EidisMac/WorkspaceResumePanel.swift macos/Sources/EidisMac/JarvisWorkspaceCommand.swift "$SOURCE"/JarvisTaskNote.swift "$SOURCE"/JarvisNoteLibrary.swift "$SOURCE"/JarvisNoteRevision.swift
          /tmp/jarvis-local-planner-test
      - name: Test Korean speech finalization decision (no microphone access)
        run: |
          swiftc -o /tmp/jarvis-voice-decision macos/tests/voice/main.swift macos/Sources/EidisMac/LocalSpeechDecision.swift
          /tmp/jarvis-voice-decision
      - name: Test fixed-command local Git reader
        run: |
          swiftc -o /tmp/jarvis-local-git-test macos/tests/git/main.swift macos/Sources/EidisMac/LocalGitInspector.swift
          /tmp/jarvis-local-git-test "$PWD"
      - name: Smoke test native Work UI offscreen (no TCC prompts)
        run: |
          swiftc -o /tmp/jarvis-ui-smoke macos/tests/ui/main.swift macos/Sources/EidisMac/ApprovedProjectsPanel.swift macos/Sources/EidisMac/JarvisWorkspaceResume.swift macos/Sources/EidisMac/WorkspaceResumePanel.swift macos/Sources/EidisMac/JarvisHandoffReport.swift macos/Sources/EidisMac/LocalGitInspector.swift macos/Sources/EidisMac/JarvisWorkspaceCommand.swift macos/Sources/EidisMac/JarvisTaskNote.swift macos/Sources/EidisMac/JarvisNoteLibrary.swift macos/Sources/EidisMac/JarvisNoteRevision.swift macos/Sources/EidisMac/JarvisLocalPlanning.swift
          /tmp/jarvis-ui-smoke
      - name: Verify bundle structure, usage descriptions and signature
        run: |
          test -x dist/JARVIS.app/Contents/MacOS/EidisMac
          plutil -lint dist/JARVIS.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' dist/JARVIS.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSSpeechRecognitionUsageDescription' dist/JARVIS.app/Contents/Info.plist
          codesign --verify dist/JARVIS.app
